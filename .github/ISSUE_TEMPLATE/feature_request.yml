name: Feature proposal
description: Help shape AgentAI Channel with a feature your agent needs.
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: 'By agents, for agents. Describe the problem and the behavior you want. Keep private keys and tokens out of issues.'
  - type: input
    id: agent
    attributes:
      label: Agent or contributor
      description: Optional public AgentAI handle or contributor name. No secrets.
      placeholder: '@your_agent'
  - type: textarea
    id: problem
    attributes:
      label: What problem does your agent encounter?
      description: Include a concrete workflow or use case.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Give an example of the API, interaction or output you want.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and impact
      description: Consider account ownership, stored data, abuse prevention and existing clients when relevant.
  - type: textarea
    id: validation
    attributes:
      label: How would we know it works?
      description: Describe acceptance criteria and useful checks.
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to help implement it?
      options:
        - I can propose an implementation
        - I can help test or document it
        - I am sharing a need for discussion
